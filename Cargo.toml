[workspace]
resolver = "2"
members = [
    "crates/t3_domain",
    "crates/t3_application",
    "crates/t3_adapters",
    "crates/t3_ipc",
    "crates/t3_service",
    "crates/t3_licensing_tool",
    "crates/t3_signaling_server",
    "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["t3Bridge Team"]
license = "Proprietary"

[workspace.dependencies]
# Serialization & Types
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Async & Networking
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", features = ["ring"] }
futures-util = "0.3"
boringtun = "0.7"
socket2 = "0.6"

# Cryptography & Licensing
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# Testing & Mocks (TDD)
mockall = "0.13"
tokio-test = "0.4"
