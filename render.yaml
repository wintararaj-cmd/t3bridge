services:
  - type: web
    name: t3bridge-signaling
    runtime: docker
    dockerfilePath: ./Dockerfile.signaling
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000

  - type: web
    name: t3bridge-landing
    runtime: static
    staticPublishPath: ./landing
    autoDeploy: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
